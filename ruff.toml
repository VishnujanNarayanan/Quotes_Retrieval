# app.py builds a dark-theme stylesheet inline, so its lines run long by design.
line-length = 100
target-version = "py310"

exclude = [".venv", "app/fine-tuned-quote-model", "quotes_retrieval.ipynb"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]

[lint.per-file-ignores]
# app.py must call st.set_page_config() before any other Streamlit call, so its
# imports cannot all sit at the top of the file.
"app/app.py" = ["E402", "E501"]  # the inline stylesheet has long selector lines
# conftest.py puts app/ on sys.path before importing from it, for the same reason.
"tests/*" = ["E402"]
"eval/*" = ["E402"]
